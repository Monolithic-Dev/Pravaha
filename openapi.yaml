openapi: 3.0.3
info:
  title: Pravaha API
  version: 0.3.0
  license: { name: Apache-2.0, url: 'https://www.apache.org/licenses/LICENSE-2.0' }
  description: >
    Pravaha's internal API (v3). Prose explanation of auth, validation and
    rate-limiting decisions: docs/API.md. Every endpoint maps to an FR in docs/PRD.md.
    Every JSON request body must be sent with Content-Type: application/json,
    otherwise the route answers 415 (CSRF guard, docs/SECURITY.md).
servers:
  - url: http://localhost:3000/api
    description: Local development
components:
  securitySchemes:
    organizerCookie:
      type: apiKey
      in: cookie
      name: pravaha_org
    cloudinarySignature:
      type: apiKey
      in: header
      name: X-Cld-Signature
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Lecture:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        speaker: { type: string, nullable: true }
        status: { type: string, enum: [processing, ready, transcript_failed] }
        visibility: { type: string, enum: [unlisted, public] }
        durationS: { type: number, nullable: true }
        publicId: { type: string }
        createdAt: { type: string, format: date-time }
    SearchResult:
      type: object
      properties:
        segmentId: { type: integer }
        lectureId: { type: string, format: uuid }
        publicId: { type: string }
        title: { type: string }
        speaker: { type: string, nullable: true }
        startS: { type: number }
        endS: { type: number }
        text: { type: string }
        snippet:
          type: array
          description: "Plain-text parts; hit = matched term. Never HTML."
          items:
            type: object
            properties:
              text: { type: string }
              hit: { type: boolean }
        chapterTitle: { type: string, nullable: true }
    Citation:
      type: object
      properties:
        n: { type: integer }
        segmentId: { type: integer }
        lectureId: { type: string, format: uuid }
        title: { type: string }
        speaker: { type: string, nullable: true }
        startS: { type: number }
        endS: { type: number }
        text: { type: string }
        momentUrl: { type: string, format: uri }
    Reel:
      type: object
      nullable: true
      description: "Answer Reel: the cited moments stitched into one Cloudinary video (≤5 clips, ≤90 s)"
      properties:
        url: { type: string, format: uri }
        durationS: { type: number }
        clips: { type: integer }
    Moment:
      type: object
      properties:
        segmentId: { type: integer }
        startS: { type: number }
        endS: { type: number }
    StudyPack:
      type: object
      properties:
        summary: { type: array, items: { type: string }, maxItems: 3 }
        concepts:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Moment'
              - { type: object, properties: { name: { type: string } } }
        quiz:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Moment'
              - type: object
                properties:
                  question: { type: string }
                  options: { type: array, items: { type: string }, minItems: 4, maxItems: 4 }
                  correctIndex: { type: integer, minimum: 0, maximum: 3 }
                  explanation: { type: string }
        highlights:
          type: array
          maxItems: 5
          items:
            allOf:
              - $ref: '#/components/schemas/Moment'
              - { type: object, properties: { label: { type: string, nullable: true } } }
    Insights:
      type: object
      properties:
        totals:
          type: object
          properties:
            questions: { type: integer }
            answeredRate: { type: number, minimum: 0, maximum: 1 }
            shares: { type: integer }
        gaps:
          type: array
          items: { type: object, properties: { question: { type: string }, times: { type: integer }, lastAsked: { type: string, format: date-time } } }
        topQuestions:
          type: array
          items: { type: object, properties: { question: { type: string }, times: { type: integer }, answered: { type: integer } } }
        topMoments:
          type: array
          items:
            type: object
            properties:
              segmentId: { type: integer }
              lectureId: { type: string, format: uuid }
              title: { type: string }
              startS: { type: number }
              text: { type: string }
              opens: { type: integer }
              shares: { type: integer }
paths:
  /organizer/session:
    post:
      summary: Organizer sign-in with passcode
      operationId: signIn
      security: []  # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passcode]
              properties:
                passcode: { type: string }
      responses:
        '204': { description: Signed in; sets pravaha_org cookie }
        '400': { description: Invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Wrong passcode, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Organizer sign-out
      operationId: signOut
      security: []  # public
      responses:
        '204': { description: Cookie cleared }
  /upload-signature:
    post:
      summary: Sign a CldUploadWidget upload for an existing lecture (allow-listed params only)
      operationId: signUpload
      security: [{ organizerCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paramsToSign]
              properties:
                paramsToSign:
                  type: object
                  description: "Only public_id, upload_preset, timestamp, source"
                  additionalProperties: true
      responses:
        '200':
          description: Signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature: { type: string }
        '400': { description: Unsignable params or unknown lecture }
        '401': { description: Not an organizer }
  /webhooks/cloudinary:
    post:
      summary: Cloudinary notification (transcription complete/failed)
      operationId: cloudinaryWebhook
      security: [{ cloudinarySignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Received (including unknown public_id / ignored kinds) }
        '401': { description: Invalid or stale signature — no side effects }
        '500': { description: DB write failed — Cloudinary retries }
  /lectures:
    post:
      summary: Create a session before upload (rights confirmation required)
      operationId: createLecture
      security: [{ organizerCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, rightsConfirmed]
              properties:
                title: { type: string, minLength: 1, maxLength: 140 }
                speaker: { type: string, maxLength: 80 }
                rightsConfirmed: { type: boolean, enum: [true] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture: { $ref: '#/components/schemas/Lecture' }
                  uploadPreset: { type: string }
        '400': { description: Invalid body }
        '401': { description: Not an organizer }
    get:
      summary: List sessions (public+ready for learners; all for organizers)
      operationId: listLectures
      security: []  # public
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Lecture' } }
  /lectures/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One session (unlisted reachable by direct link)
      operationId: getLecture
      security: []  # public
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/Lecture' } } } }
        '404': { description: Not found }
    patch:
      summary: Update visibility / title / speaker
      operationId: updateLecture
      security: [{ organizerCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility: { type: string, enum: [public, unlisted] }
                title: { type: string, minLength: 1, maxLength: 140 }
                speaker: { type: string, maxLength: 80 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Lecture' } } } }
        '400': { description: Invalid body }
        '401': { description: Not an organizer }
        '404': { description: Not found }
  /search:
    get:
      summary: Find — full-text search over spoken content
      operationId: search
      security: []  # public
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: lectureId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
        '400': { description: Invalid query }
  /ask:
    post:
      summary: Ask — grounded answer with validated clip citations
      operationId: ask
      security: []  # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 3, maxLength: 300 }
                lectureId: { type: string, format: uuid }
      responses:
        '200':
          description: Answer, refusal, or fallback
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [answered, not_found, fallback] }
                  answer: { type: string, nullable: true }
                  citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
                  reel: { $ref: '#/components/schemas/Reel' }
        '400': { description: Invalid body }
        '429': { description: Rate limited (Retry-After header) }
  /lectures/{id}/study-pack:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: (Re)generate a session's Study Pack (also generated automatically after ingest)
      operationId: generateStudyPack
      security: [{ organizerCookie: [] }]
      responses:
        '200': { description: Study Pack, content: { application/json: { schema: { $ref: '#/components/schemas/StudyPack' } } } }
        '400': { description: 'Session not ready, or too short' }
        '401': { description: Not an organizer }
        '404': { description: Not found }
        '502': { description: Every model in the AI chain failed }
        '503': { description: GEMINI_API_KEY not configured }
  /events:
    post:
      summary: Anonymous Moment analytics (open / share) for organizer Insights
      operationId: recordMomentEvent
      security: []  # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segmentId, kind]
              properties:
                segmentId: { type: integer, minimum: 1 }
                kind: { type: string, enum: [open, share] }
      responses:
        '204': { description: Recorded }
        '400': { description: Invalid body }
        '404': { description: Unknown segment }
  /insights:
    get:
      summary: Organizer Insights over the last 30 days (knowledge gaps, most asked, most shared)
      operationId: getInsights
      security: [{ organizerCookie: [] }]
      responses:
        '200': { description: Insights, content: { application/json: { schema: { $ref: '#/components/schemas/Insights' } } } }
        '401': { description: Not an organizer }
